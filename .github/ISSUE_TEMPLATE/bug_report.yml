name: Relatar problema
about: Ajude a reproduzir uma falha do aplicativo ou da documentação
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que era esperado?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Navegador e sistema, se aplicável
