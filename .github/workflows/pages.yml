name: Publicar site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: devstart-lab-pages
  cancel-in-progress: false
  queue: max
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test
      - name: Install WebAssembly compiler
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .emsdk
          .emsdk/emsdk install 6.0.12
          .emsdk/emsdk activate 6.0.12
      - name: Build verified project pages and executable demos
        run: |
          source .emsdk/emsdk_env.sh
          emcc --version
          python scripts/build-proofs.py
      - run: npm run build
      - name: Validate generated links
        run: python scripts/check-proof-pages.py
      - name: Install browser verification tools
        run: |
          npm install --prefix .qa --no-save --no-audit --no-fund playwright@1.64.0
          node .qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify executable demos in Chromium
        run: node scripts/test-proof-browser.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
