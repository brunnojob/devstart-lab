name: Qualidade
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run test:security
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Install browser verification tools
        run: |
          npm install --prefix .qa --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.0
          node .qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify main application in Chromium
        run: node scripts/test-app-browser.mjs
